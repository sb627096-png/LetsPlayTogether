<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's Play Together</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #090914;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 92%;
            max-width: 500px;
            text-align: center;
        }

        .logo {
            font-size: 42px;
            margin-bottom: 8px;
        }

        h1 {
            margin: 0;
            font-size: 34px;
        }

        .tagline {
            color: #aaa;
            margin: 10px 0 35px;
            font-size: 15px;
        }

        .option {
            width: 100%;
            padding: 22px;
            margin: 15px 0;
            border: 1px solid #333;
            border-radius: 20px;
            background: #151525;
            color: white;
            cursor: pointer;
            text-align: left;
            transition: 0.2s;
        }

        .option:hover {
            transform: scale(1.02);
            background: #20203a;
        }

        .icon {
            font-size: 34px;
            margin-bottom: 8px;
        }

        .title {
            font-size: 21px;
            font-weight: bold;
        }

        .description {
            color: #aaa;
            margin-top: 6px;
            font-size: 14px;
        }

        .footer {
            margin-top: 35px;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">🎮</div>

    <h1>Let's Play Together</h1>

    <div class="tagline">
        Connect • Play • Compete
    </div>

    <button class="option" onclick="location.href='remote.html'">
        <div class="icon">📱</div>
        <div class="title">Play as a Remote</div>
        <div class="description">
            Use this phone as a game controller
        </div>
    </button>

    <button class="option" onclick="location.href='monitor.html'">
        <div class="icon">🖥️</div>
        <div class="title">See as a Monitor</div>
        <div class="description">
            Use this device as the main game screen
        </div>
    </button>

    <div class="footer">
        Multiplayer gaming with your phones
    </div>

</div>

</body>
</html>
